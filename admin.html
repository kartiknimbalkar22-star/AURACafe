<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Café - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 20px;
    }

    h2 {
      margin: 30px 0 15px;
      color: #d4af37;
    }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: #151515;
      padding: 25px;
      border-radius: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      margin-top: 10px;
    }

    .logout {
      float: right;
      background: #333;
      color: white;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin: 12px 0;
    }

    .card p {
      margin: 7px 0;
    }

    .empty {
      color: #999;
      padding: 15px 0;
    }

    #error {
      color: #ff6b6b;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="login-box">
    <h1>AURA Café ☕</h1>
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="error"></p>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none;">

    <button class="logout" onclick="logout()">Logout</button>

    <h1>☕ AURA Café Admin</h1>

    <h2>📦 Orders</h2>
    <div id="orders">
      <p class="empty">Loading orders...</p>
    </div>

    <h2>📅 Reservations</h2>
    <div id="reservations">
      <p class="empty">Loading reservations...</p>
    </div>

  </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

  const firebaseConfig = {
    apiKey: "AIzaSyBvVyvosQ9QmcuNgP7xgbIW6jjGrL_nkUBQg",
    authDomain: "aura-cafe-a6e29.firebaseapp.com",
    databaseURL: "https://aura-cafe-a6e29-default-rtdb.firebaseio.com",
    projectId: "aura-cafe-a6e29",
    storageBucket: "aura-cafe-a6e29.firebasestorage.app",
    messagingSenderId: "29989829819",
    appId: "1:29989829819:web:af2814e6eab14cf15d76"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const database = firebase.database();


  // LOGIN
  function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      document.getElementById("error").innerText =
        "Email आणि password टाका.";
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .catch((error) => {
        document.getElementById("error").innerText =
          error.message;
      });
  }


  // LOGOUT
  function logout() {
    auth.signOut();
  }


  // AUTH CHECK
  auth.onAuthStateChanged((user) => {

    if (user) {

      document.getElementById("loginSection").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      loadOrders();
      loadReservations();

    } else {

      document.getElementById("loginSection").style.display = "block";
      document.getElementById("dashboard").style.display = "none";

    }

  });


  // ORDERS
  function loadOrders() {

    const ordersDiv = document.getElementById("orders");

    database.ref("orders").on("value", (snapshot) => {

      ordersDiv.innerHTML = "";

      if (!snapshot.exists()) {
        ordersDiv.innerHTML =
          '<p class="empty">No orders yet.</p>';
        return;
      }

      snapshot.forEach((child) => {

        const order = child.val();

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <p><b>👤 Name:</b> ${order.name || "-"}</p>
          <p><b>📞 Phone:</b> ${order.phone || "-"}</p>
          <p><b>☕ Item:</b> ${order.item || "-"}</p>
          <p><b>🔢 Quantity:</b> ${order.quantity || "-"}</p>
          <p><b>💰 Total:</b> ₹${order.total || "-"}</p>
        `;

        ordersDiv.prepend(card);

      });

    });

  }


  // RESERVATIONS
  function loadReservations() {

    const reservationsDiv =
      document.getElementById("reservations");

    database.ref("reservations").on("value", (snapshot) => {

      reservationsDiv.innerHTML = "";

      if (!snapshot.exists()) {
        reservationsDiv.innerHTML =
          '<p class="empty">No reservations yet.</p>';
        return;
      }

      snapshot.forEach((child) => {

        const reservation = child.val();

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <p><b>👤 Name:</b> ${reservation.name || "-"}</p>
          <p><b>📞 Phone:</b> ${reservation.phone || "-"}</p>
          <p><b>📅 Date:</b> ${reservation.date || "-"}</p>
          <p><b>⏰ Time:</b> ${reservation.time || "-"}</p>
          <p><b>👥 Guests:</b> ${reservation.guests || "-"}</p>
        `;

        reservationsDiv.prepend(card);

      });

    });

  }

</script>

</body>
</html>
